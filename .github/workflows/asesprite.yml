name: Compilar Aseprite (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de Aseprite a compilar'
        required: true
        default: 'v1.3.11'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clonar código fuente de Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ github.event.inputs.version }}
          submodules: 'recursive'

      - name: Instalar Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Habilitar MSVC (C++)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Descargar motor gráfico Skia
        run: |
          Invoke-WebRequest -Uri https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip -OutFile skia.zip
          Expand-Archive skia.zip -DestinationPath skia

      - name: Configurar CMake
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/gn.exe" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLAF_BACKEND=skia -DSKIA_DIR=../skia -DSKIA_LIBRARY_DIR=../skia/out/Release-x64 -DSKIA_LIBRARY=../skia/out/Release-x64/skia.lib -G Ninja ..

      - name: Compilar
        run: |
          cd build
          ninja aseprite

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ github.event.inputs.version }}-Windows
          path: build/bin/
